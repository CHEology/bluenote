# Blue Note — site overrides for the bluenote theme.
# docs/DESIGN.md is the authority for every value below.

brand: Blue Note
# One bar of fixed height on every page; the home page is held between two fixed bars.
design: letterbox
favicon: /images/favicon-64.png
apple_touch_icon: /images/apple-touch-icon.png

nav:
  menu:
    - { name: Archives, link: /archives/ }
    - { name: Gallery, link: /gallery/ }
    - { name: About, link: /about/ }
    - { name: Search, link: "#site-search", icon: search }
  scheme_toggle: true

home:
  cover: /images/theme_fluid_bg/2021.11-2880.jpg
  preload_cover: true
  # Portrait phones: the same picture cropped to 9:10 around the figure on the central axis.
  cover_portrait:
    base: /images/theme_fluid_bg/2021.11-portrait
    widths: [720, 1080, 1440]
  cover_placeholder: 'data:image/webp;base64,UklGRnAAAABXRUJQVlA4IGQAAACwAwCdASogAA4APu1iqk2ppaQiMAgBMB2JYgCdMoADTa17LfVbgADLJdeSTIQlMftxGmWOqqPY22vDzhmSkE/bN0sKezrBcFo2M3YhVWSH+LAbuw/nmKAOrrJO6hMq8/AJsSQA'
  slogan: Dream to be a tranquil spectator.

cjk_punctuation: true

fonts:
  ui: '"EB Garamond", Charter, Georgia, "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "Blue Note Serif SC", STSong, serif'
  prose: '"EB Garamond", Charter, Georgia, "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "Blue Note Serif SC", STSong, serif'
  # Formulas share the prose face; EB Garamond has no ∝ or →, which fall back to Times.
  math: '"EB Garamond", Times, "Times New Roman", Georgia, serif'
  cjk: '"Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "Blue Note Serif SC", STSong, serif'

# Paper by day, blue hour by night; the bar keeps the home's blue-black in both.
colors:
  light:
    paper: "#ecebe6"
    text: "#34393d"
    prose: "#34393d"
    heading: "#1d2226"
    muted: "#62686d"
    link: "#3d5a73"
    link-hover: "#243c50"
    link-hover-bg: "rgba(61, 90, 115, 0.08)"
    line: "rgba(52, 57, 61, 0.15)"
    masthead: "#061521"
    masthead-text: "#eeebe3"
    panel: "rgba(61, 90, 115, 0.06)"
  dark:
    paper: "#0e1922"
    text: "#d3dade"
    prose: "#cdd5d9"
    heading: "#edf0ec"
    muted: "#8d9ba4"
    link: "#a4c0d6"
    link-hover: "#d6e2ea"
    link-hover-bg: "rgba(164, 192, 214, 0.08)"
    line: "rgba(205, 213, 217, 0.14)"
    masthead: "#061521"
    masthead-text: "#eeebe3"
    panel: "rgba(164, 192, 214, 0.06)"
    code-bg: "#13212c"
    inline-code-bg: "rgba(164, 192, 214, 0.14)"
    scrollbar: "#3a4a57"
    scrollbar-hover: "#5a6b78"
  home:
    bg: "#061521"
    nav: "#061521"
    nav-dark: "#061521"

post:
  language: zh-CN
  date_format: YYYY 年 M 月 D 日
  year_format: YYYY 年
  toc:
    enable: true
  prev_next: true
  show_tags: false
  photo_layout:
    enable: true

archive:
  extra_entries: []
  # Year counts, each post's length on the right and its first sentence below the title.
  details: true
  details_labels:
    posts: '{n} 篇'
    length: '{n} 字'
    length_large: '约 {n} 万字'
    large_from: 10000
    large_divisor: 10000
    photos: '{n} 幅'

# Composition year is separate from the encrypted source's upload timestamp.
historical_posts:
  eeddfa74ef298a0c:
    year: 2018

about:
  avatar: /images/avatar-256.png
  name: cheology
  intro: 语言的边界划定思绪的历史与领地。

tags:
  enable: true
categories:
  enable: false
page404:
  enable: true
  cover: /images/theme_fluid_bg/videoCover-穿梭在暴雨中的武汉杨泗港大桥..1213717019.jpeg

search:
  enable: true
  path: /local-search.xml
  private_manifest: /private/posts.public.json

custom_css:
  - /fonts/eb-garamond/eb-garamond.css
  - /css/site.css
  - /css/design-doc.css
  - /css/thought-notes.css
  - /css/private.css
# The Chinese web font is only a fallback for systems without a Chinese serif, so its
# long list of slices loads without holding up the first paint.
custom_css_deferred:
  - /fonts/noto-serif-sc/noto-serif-sc.css
custom_js:
  - /js/private.js

gallery:
  enable: true
  language: zh-CN
  labels:
    view: Gallery view
    few: A few
    all: All photographs
    reshuffle: Shuffle
    view_all: View all photographs
    selection: "{count} photographs. New selection."
    reshuffle_error: Unable to shuffle. Please try again.
