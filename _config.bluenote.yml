# Blue Note — site overrides for the bluenote theme.
# Colour and font tokens use the theme defaults (themes/bluenote/_config.yml);
# docs/DESIGN.md is the authority for any change to them.

brand: Blue Note
favicon: /images/favicon-64.png
apple_touch_icon: /images/apple-touch-icon.png

nav:
  menu:
    - { name: Home, link: / }
    - { name: Archives, link: /archives/ }
    - { name: Gallery, link: /gallery/ }
    - { name: About, link: /about/ }
    - { name: Search, link: "#site-search", icon: search }
  scheme_toggle: true

home:
  cover: /images/theme_fluid_bg/2021.11-2880.jpg
  preload_cover: true
  slogan: Dream to be a tranquil spectator.
  typing:
    enable: true
    mobile: false
    speed: 70
    cursor: "_"
  cards: 12

post:
  language: zh-CN
  toc:
    enable: true
  prev_next: true
  show_tags: false
  photo_layout:
    enable: true

archive:
  extra_entries:
    - { section: SITE, kind: DOC, title: Design Doc, summary: 颜色、字体、排版与组件规范, link: /design/ }

about:
  avatar: /images/avatar-256.png
  name: cheology
  intro: 语言的边界划定思绪的历史与领地。

tags:
  enable: true
categories:
  enable: false
page404:
  enable: true
  cover: /images/theme_fluid_bg/videoCover-穿梭在暴雨中的武汉杨泗港大桥..1213717019.jpeg

search:
  enable: true
  path: /local-search.xml
  private_manifest: /private/posts.public.json

custom_css:
  - /css/site.css
  - /css/design-doc.css
  - /css/thought-notes.css
  - /css/private.css
custom_js:
  - /js/private.js

gallery:
  enable: true
  language: zh-CN
  labels:
    view: Gallery view
    few: A few
    all: All photographs
    reshuffle: Reshuffle
    view_all: View all photographs
    selection: "{count} photographs. New selection."
    reshuffle_error: Unable to reshuffle. Please try again.
