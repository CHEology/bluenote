name: Build and deploy Blue Note

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluenote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and validate
        run: npm run check

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          stage="$RUNNER_TEMP/cloudflare-site"
          mkdir -p "$stage"
          mv public "$stage/bluenote"
          cp "$stage/bluenote/404.html" "$stage/404.html"
          printf '/ /bluenote/ 302\n' > "$stage/_redirects"
          printf '%s\n' "$GITHUB_SHA" > "$stage/bluenote/revision.txt"
          npx --yes wrangler@4.159.0 pages deploy "$stage" --project-name bluenote-cheology --branch master --commit-hash "$GITHUB_SHA"

      - name: Verify the published revision
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          url="https://bluenote-cheology.pages.dev/bluenote/revision.txt?v=$GITHUB_SHA"
          for attempt in {1..30}; do
            if [[ "$(curl -fsS --max-time 5 "$url")" == "$GITHUB_SHA" ]]; then exit 0; fi
            sleep 2
          done
          echo "Cloudflare has not served revision $GITHUB_SHA at the production address."
          exit 1
