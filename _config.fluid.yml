# Blue Note theme overrides. Unspecified options inherit Fluid defaults.

favicon: /images/theme_fluid_bg/机动警察 和平保卫战 猫 头像.png
apple_touch_icon: /images/theme_fluid_bg/机动警察 和平保卫战 猫 头像.png
force_https: true

dark_mode:
  enable: true
  default: auto

scroll_top_arrow:
  enable: false

# Preserve the typography used by the pre-migration site.
font:
  font_size: 16px
  font_family: 'Times, "Times New Roman", Georgia, serif'
  letter_spacing: 0.02em
  code_font_size: 85%

fun_features:
  typing:
    enable: true
    typeSpeed: 70
    cursorChar: "_"
    loop: false
    scope:
      - home

custom_css:
  - /css/home.css
  - /css/custom.css
  - /css/literary-blocks.css
  - /css/thought-notes.css
  - /css/private.css
  - /css/search.css
  - /css/typography.css

custom_js:
  - /js/site.js
  - /js/home.js
  - /js/private.js
  - /js/search.js

# Pinned copies of the same theme dependencies, served with the site.
static_prefix:
  bootstrap: /vendor/bootstrap/4.6.1/
  jquery: /vendor/jquery/3.6.4/
  typed: /vendor/typed.js/2.0.12/
  nprogress: /vendor/nprogress/0.2.0/

navbar:
  blog_title: Blue Note
  ground_glass:
    enable: false
  menu:
    - { key: "home", link: "/" }
    - { key: "archive", link: "/archives/" }
    - { key: "gallery", name: "Gallery", link: "/gallery/" }
    - { key: "about", link: "/about/" }
    - { key: "search", name: "Search", link: "#site-search", icon: "iconfont icon-search" }

search:
  enable: false
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

banner:
  random_img: false
  parallax: false
  width_height_ratio: 1.0

scroll_down_arrow:
  enable: false

footer:
  content: ""
  statistics:
    enable: false
  beian:
    enable: false

index:
  banner_img: /images/theme_fluid_bg/2021.11-2880.jpg
  banner_img_height: 100
  banner_mask_alpha: 0.3
  slogan:
    enable: true
    text: Dream to be a tranquil spectator.
  auto_excerpt:
    enable: true
  post_url_target: _self
  post_meta:
    date: true
    category: false
    tag: false

post:
  default_index_img:
  meta:
    author:
      enable: false
    date:
      enable: true
      format: YYYY-MM-DD
    wordcount:
      enable: false
    min2read:
      enable: false
    views:
      enable: false
  category_bar:
    enable: false
  toc:
    enable: true
    expand_all: true
    placement: right
    headingSelector: h1,h2,h3,h4,h5,h6
    collapseDepth: 0
  copyright:
    enable: false

archive: {}

category:
  enable: false

tag:
  enable: true

about:
  enable: true
  avatar: /images/theme_fluid_bg/机动警察 和平保卫战 猫 头像.png
  name: cheology
  intro: 语言的边界划定思绪的历史与领地。
  icons: []

links:
  enable: false

page404:
  enable: true
  banner_img: /images/theme_fluid_bg/videoCover-穿梭在暴雨中的武汉杨泗港大桥..1213717019.jpeg
